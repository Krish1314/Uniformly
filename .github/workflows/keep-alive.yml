name: Keep Render App Awake

on:
  schedule:
    # Runs every 14 minutes
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend API
        run: |
          curl -sS -o /dev/null -w "%{http_code}" https://uniformly-java.onrender.com/api/v1/products
